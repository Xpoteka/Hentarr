name: Docker

on:
  push:
    branches:
      - v2-develop
      - v2
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        shell: bash
        run: |
          # AssemblyVersion must be 4-part numeric; take major.minor.patch from
          # the tag when building a tag, otherwise use the default version line.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            BASE="${GITHUB_REF_NAME#v}"
            BASE="${BASE%%-*}"
          else
            BASE="2.2.0"
          fi
          echo "version=$BASE.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/xpoteka/hentarr
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/v2-develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/v2' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BRANCH=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
